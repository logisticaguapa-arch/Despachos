# =====================================================================================================
#  ACTUALIZAR HORAS  (copiar a  .github/workflows/actualizar-horas.yml  en el repositorio Despachos)
#
#  Lo dispara la macro "PublicarHoras" del Excel (boton "Publicar horas") al cerrar la operacion.
#  1) Descarga los libros de Excel desde OneDrive con sus enlaces ("Cualquier persona con el enlace").
#  2) convertir_horas.py los convierte a  datos/horas_control.json  y  datos/horas_consolidado.json
#  3) Guarda los cambios en el repositorio. costos.html e index.html leen esos archivos.
#
#  SECRETOS necesarios (Settings > Secrets and variables > Actions > New repository secret):
#     ENLACE_CONTROL_HORAS   enlace de OneDrive del libro CONTROL DE HORAS DESPACHOS
#     ENLACE_CONSOLIDADO     enlace de OneDrive del reporte consolidado (opcional)
#  Se guardan como secretos porque el repositorio es publico y el enlace da acceso al archivo.
# =====================================================================================================
name: Actualizar horas

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-horas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar openpyxl
        run: pip install openpyxl

      - name: Descargar los libros desde OneDrive
        env:
          ENLACE_CONTROL: ${{ secrets.ENLACE_CONTROL_HORAS }}
          ENLACE_CONSOLIDADO: ${{ secrets.ENLACE_CONSOLIDADO }}
        run: |
          set -e
          es_excel () { head -c 2 "$1" | grep -q "PK"; }
          intentar () {
            # $1 = direccion, $2 = archivo de destino, $3 = descripcion del intento
            info=$(curl -L -sS -o "$2" -c cookies.txt -b cookies.txt -w "%{http_code}|%{content_type}|%{url_effective}" "$1" || true)
            codigo=$(echo "$info" | cut -d'|' -f1)
            tipo=$(echo "$info" | cut -d'|' -f2)
            host=$(echo "$info" | cut -d'|' -f3 | awk -F/ '{print $3}')
            echo "Intento ($3): HTTP $codigo | tipo $tipo | servidor final $host | $(stat -c%s "$2") bytes"
            es_excel "$2"
          }
          descargar () {
            enlace="$1"; archivo="$2"
            if [ -z "$enlace" ]; then echo "Sin enlace para $archivo: se omite"; return 0; fi
            # forma del enlace (sin datos sensibles): :x:/g/personal = enlace compartido; :x:/r/ = enlace con ruta; personal/... = ruta directa
            echo "Forma del enlace de $archivo: /$(echo "$enlace" | cut -d/ -f4-6)"
            case "$enlace" in
              *download=1*) url="$enlace" ;;
              *\?*)         url="$enlace&download=1" ;;
              *)            url="$enlace?download=1" ;;
            esac
            if intentar "$url" "$archivo" "enlace con download=1"; then echo "Descargado $archivo correctamente"; return 0; fi
            # Plan B: ruta de descarga directa de SharePoint para enlaces compartidos (/g/personal/... o /s/sitio/...)
            alt=$(echo "$enlace" | sed -n -E 's#^(https?)://([^/]+)/:[a-z]:/g/personal/([^/]+)/([^/?]+).*#\1://\2/personal/\3/_layouts/15/download.aspx?share=\4#p')
            [ -z "$alt" ] && alt=$(echo "$enlace" | sed -n -E 's#^(https?)://([^/]+)/:[a-z]:/s/([^/]+)/([^/?]+).*#\1://\2/sites/\3/_layouts/15/download.aspx?share=\4#p')
            if [ -n "$alt" ]; then
              if intentar "$alt" "$archivo" "descarga directa download.aspx"; then echo "Descargado $archivo correctamente"; return 0; fi
            else
              echo "No se pudo armar la ruta de descarga directa: el enlace no es del tipo compartido (/:x:/g/ o /:x:/s/)."
            fi
            titulo=$(grep -o -i '<title>[^<]*' "$archivo" | head -1 | sed 's/<[Tt][Ii][Tt][Ll][Ee]>//')
            echo "Titulo de la pagina recibida: ${titulo:-ninguno}"
            case "$host" in
              *login.microsoftonline*|*login.live*|*login.windows*)
                echo "::error::El enlace de $archivo pide iniciar sesion en Microsoft: no es publico. Usa Compartir > Cualquier persona con el vinculo > Puede ver." ;;
              *)
                echo "::error::SharePoint devolvio la pagina del visor y no el archivo. En Compartir > configuracion del vinculo elige 'Cualquier persona con el vinculo', 'Puede ver' y DESACTIVA 'Bloquear descarga'. Si no se puede, TI debe permitir la descarga en vinculos anonimos." ;;
            esac
            exit 1
          }
          descargar "$ENLACE_CONTROL" control.xlsx
          descargar "$ENLACE_CONSOLIDADO" consolidado.xlsx

      - name: Convertir a datos
        run: |
          args=""
          [ -s control.xlsx ] && args="$args --control control.xlsx"
          [ -s consolidado.xlsx ] && args="$args --consolidado consolidado.xlsx"
          python convertir_horas.py $args --salida datos

      - name: Guardar en el repositorio
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add datos/*.json
          if git diff --staged --quiet; then echo "Sin cambios en las horas"; exit 0; fi
          git commit -m "Horas actualizadas $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
